<script>
// ===== TỰ ĐỘNG TẢI + FALLBACK UPLOAD =====
let autoLoaded = false;

async function autoLoadData() {
    try {
        const uploadBox = document.getElementById("uploadBox");
        const desc = document.getElementById("uploadDesc");
        desc.textContent = '⏳ Đang tải dữ liệu từ server...';
        
        // Thử tải file Excel (thử nhiều tên)
        let response;
        try {
            response = await fetch('data.xlsx');
        } catch (e) {
            // Nếu lỗi, thử tên không dấu
            response = await fetch('data.xlsx');
        }
        
        if (!response.ok) {
            // Nếu không tìm thấy, thử tên khác
            response = await fetch('data.xlsx');
        }
        
        if (!response.ok) throw new Error('Không tìm thấy file Excel');
        
        const arrayBuffer = await response.arrayBuffer();
        const parsed = parseWorkbook(arrayBuffer);
        parsed.fileName = 'THONG KE.xlsx';
        
        state = { 
            data: parsed, 
            metric: "a", 
            selectedCoSo: null, 
            sortDir: "asc", 
            searchText: "", 
            warningFilter: "all" 
        };
        
        render();
        autoLoaded = true;
        document.getElementById("uploadBox").style.display = "none";
        document.getElementById("app-content").style.display = "block";
        document.getElementById("resetBtn").style.display = "inline-block";
        document.getElementById("resetBtn").textContent = "Tải lại";
        
    } catch (error) {
        console.log('Auto-load error:', error.message);
        // Hiển thị form upload để người dùng upload thủ công
        const desc = document.getElementById("uploadDesc");
        desc.textContent = '🔍 Không tìm thấy dữ liệu mặc định. Vui lòng chọn file .xlsx để xem báo cáo.';
        document.getElementById("uploadBox").style.display = "block";
        document.querySelector('.btn-primary').style.display = 'inline-block';
    }
}

// Tự động tải khi trang load
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(autoLoadData, 500);
});

// Reset
document.getElementById("resetBtn").addEventListener("click", () => {
    if (autoLoaded) {
        window.location.reload();
    } else {
        state = { data: null, metric: "a", selectedCoSo: null, sortDir: "asc", searchText: "", warningFilter: "all" };
        document.getElementById("fileInput").value = "";
        document.getElementById("searchInput").value = "";
        document.getElementById("warnSelect").value = "all";
        render();
    }
});
</script>
